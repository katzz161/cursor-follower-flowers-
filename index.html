<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowers For You</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #b9d2ff;
      font-family: Georgia, "Times New Roman", serif;
    }

    .scene {
      position: relative;
      width: min(100vw, 1100px);
      aspect-ratio: 1.38 / 1;
      min-height: 560px;
      max-height: 95vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.18), transparent 58%),
        #b9d2ff;
    }

    .wreath {
      position: absolute;
      inset: 4% 3%;
      pointer-events: none;
    }

    .flower {
      position: absolute;
      width: var(--size);
      height: var(--size);
      transform: translate(-50%, -50%) rotate(var(--turn, 0deg));
      filter: drop-shadow(2px 5px 4px rgba(75, 44, 91, .24));
      animation: appear .9s both;
      animation-delay: var(--delay, 0s);
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 29%;
      height: 46%;
      margin-left: -14.5%;
      margin-top: -44%;
      border-radius: 55% 55% 42% 42%;
      transform-origin: 50% 96%;
      background: var(--petal-colour);
      box-shadow: inset -2px -3px 4px rgba(80, 30, 70, .09);
    }

    .flower .centre {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 17%;
      height: 17%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: var(--centre-colour, #d58a9d);
      box-shadow: 0 1px 3px rgba(70, 35, 60, .2);
    }

    .flower.small .petal {
      width: 23%;
      height: 39%;
      margin-left: -11.5%;
      margin-top: -38%;
    }

    .flower.small .centre {
      width: 14%;
      height: 14%;
    }

    .flower.heart .petal {
      width: 37%;
      height: 45%;
      margin-left: -18.5%;
      margin-top: -43%;
      border-radius: 50% 50% 38% 38%;
    }

    .flower.heart .centre {
      width: 12%;
      height: 12%;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 51%;
      transform: translate(-50%, -50%);
      width: 80%;
      text-align: center;
      color: #d65c83;
      font-size: clamp(30px, 5.2vw, 66px);
      line-height: 1.1;
      text-shadow: 0 1px 0 rgba(255,255,255,.3);
      animation: fadeIn 2s .8s both;
    }

    .subtitle {
      display: block;
      margin-top: 12px;
      font-family: Arial, sans-serif;
      font-size: clamp(10px, 1.2vw, 15px);
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(185, 76, 119, .72);
    }

    .hint {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(80, 78, 140, .62);
      font: 11px Arial, sans-serif;
      letter-spacing: .08em;
    }

    @keyframes appear {
      from {
        opacity: 0;
        scale: .2;
      }
      to {
        opacity: 1;
        scale: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -43%);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }

    @media (max-width: 600px) {
      .scene {
        min-height: 500px;
        aspect-ratio: .82 / 1;
      }

      .wreath {
        inset: 7% 1%;
      }

      .message {
        top: 50%;
        width: 88%;
      }
    }
  </style>
</head>

<body>

  <main class="scene" aria-label="A pastel flower wreath with the message Flowers For You">

    <div class="wreath" id="wreath"></div>

    <div class="message">
      Flowers For You
      <span class="subtitle">A little something, just for you</span>
    </div>

    <div class="hint">click anywhere to add a flower</div>

  </main>

  <script>

    const isTouchDevice =
      window.matchMedia("(pointer: coarse)").matches ||
      navigator.maxTouchPoints > 0 ||
      "ontouchstart" in window;

    let m = { x: 0, y: 0 };
    let previous = { x: 0, y: 0 };
    let scale = 1;
    let isDrawing = false;
    let pendingPoint = null;
    let drawRaf = null;

    const wreath = document.getElementById("wreath");

    const colours = [
      "#f5c5df",
      "#f3a8d0",
      "#e985ad",
      "#d94e79",
      "#f7d6e9",
      "#c978a5",
      "#eab2c9",
      "#f1bfd0"
    ];

    const centres = [
      "#d58a9d",
      "#e6a0b2",
      "#bd668b",
      "#f0c0a4"
    ];

    class Flower {

      constructor(n, pos, scale, parent) {
        this.n = n;
        this.scale = scale;
        this.pos = pos;
        this.width = 40;
        this.height = 40;
        this.color = colours[
          Math.floor(Math.random() * colours.length)
        ];
        this.parent = parent;
        this.markup();
      }

      markup() {

        const flower = document.createElement("div");

        flower.className = "flower";

        flower.style.left = `${this.pos.x}%`;
        flower.style.top = `${this.pos.y}%`;

        flower.style.setProperty(
          "--size",
          `${this.scale}px`
        );

        flower.style.setProperty(
          "--petal-colour",
          this.color
        );

        flower.style.setProperty(
          "--centre-colour",
          centres[Math.floor(Math.random() * centres.length)]
        );

        flower.style.setProperty(
          "--turn",
          `${Math.random() * 35 - 17}deg`
        );

        flower.style.setProperty(
          "--delay",
          `${Math.random() * .8}s`
        );

        for (let i = 0; i < this.n; i++) {

          const petal = document.createElement("span");

          petal.className = "petal";

          petal.style.transform =
            `rotate(${(360 / this.n) * i}deg)`;

          flower.appendChild(petal);

        }

        const centre = document.createElement("span");

        centre.className = "centre";

        flower.appendChild(centre);

        this.parent.appendChild(flower);

      }

    }

    function makeWreath() {

      const isMobile = window.innerWidth < 600;

      const count = isMobile ? 48 : 62;

      const centreX = 50;
      const centreY = 50;

      const radiusX = isMobile ? 43 : 45;
      const radiusY = isMobile ? 39 : 43;

      for (let i = 0; i < count; i++) {

        const angle =
          (Math.PI * 2 * i) / count - Math.PI / 2;

        const x = centreX + Math.cos(angle) * radiusX;
        const y = centreY + Math.sin(angle) * radiusY;

        const featured = i % 7 === 0;
        const tiny = i % 3 === 0 && !featured;

        const size = featured
          ? (isMobile ? 65 : 92)
          : tiny
            ? (isMobile ? 24 : 31)
            : (isMobile ? 39 : 51);

        const petals = featured ? 6 : tiny ? 9 : 8;

        const kind = featured && i % 2 === 0
          ? "heart"
          : (tiny ? "small" : "normal");

        new Flower(
          petals,
          { x, y },
          size,
          wreath
        );

      }

    }

    function addFlower(event) {

      if (event.target.closest(".hint")) return;

      const rect = wreath.getBoundingClientRect();

      const x =
        ((event.clientX - rect.left) / rect.width) * 100;

      const y =
        ((event.clientY - rect.top) / rect.height) * 100;

      if (x < 0 || x > 100 || y < 0 || y > 100) return;

      m = { x, y };

      previous = { ...m };

      pendingPoint = { ...m };

      isDrawing = true;

      new Flower(
        7 + Math.floor(Math.random() * 3),
        pendingPoint,
        window.innerWidth < 600 ? 35 : 48,
        wreath
      );

      isDrawing = false;

      pendingPoint = null;

    }

    makeWreath();

    document.querySelector(".scene").addEventListener(
      "pointerup",
      addFlower
    );

  </script>

</body>
</html>
